name: Update events

on:
  schedule:
    # Daily, off the top of the hour: GitHub delays top-of-hour cron jobs by
    # hours under load. 04:37 UTC = 05:37 Madrid (winter) / 06:37 (summer).
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Overlapping runs (manual + scheduled) would race on the rebase/push.
concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run aggregator
        run: python aggregator.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Everything the pipeline writes lives under data/ and public/
          # (history, registry, run log, stats and the static API).
          if [ -z "$(git status --porcelain -- data public)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git add -A data public
          git commit -m "chore: update events.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git fetch origin main
          git rebase origin/main
          git push

      # Runs even when an earlier step failed: a failed run opens a
      # "[health] pipeline" issue instead of failing silently.
      - name: Sync scraper health issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.sync_health_issues --pipeline-status "${{ job.status }}"
